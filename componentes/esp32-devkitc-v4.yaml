regras:
  - id: gpio-input-only
    descricao: "GPIO34, GPIO35, GPIO36 e GPIO39 são exclusivamente entradas. Não podem ser utilizados como saídas digitais."
    severidade: erro

  - id: gpio-flash-reserved
    descricao: "GPIO6 até GPIO11 são utilizados pela memória Flash interna do módulo. Não devem ser utilizados como GPIOs comuns."
    severidade: erro

  - id: gpio-strapping
    descricao: "GPIO0, GPIO2, GPIO5, GPIO12 e GPIO15 são pinos de configuração durante a inicialização. Circuitos externos não devem interferir nos estados elétricos exigidos durante o boot."
    severidade: aviso

  - id: adc2-wifi
    descricao: "Os canais ADC2 não podem ser utilizados para leituras analógicas enquanto o Wi-Fi estiver ativo."
    severidade: erro

  - id: gpio-not-5v-tolerant
    descricao: "Os pinos GPIO não são tolerantes a 5 V. Nunca conectar sinais de 5 V diretamente aos GPIOs do ESP32."
    severidade: erro

status: rascunho
