
id: display-lcd-1602-i2c
descricao: Display LCD alfanumérico de 16 colunas por 2 linhas, baseado no controlador HD44780 e equipado com adaptador I2C utilizando expansor de portas PCF8574 ou PCF8574A, ajuste de contraste e iluminação de fundo.

kicad_simbolo: Connector_Generic:Conn_01x04
kicad_footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical

alimentacao_min: 5.0
alimentacao_max: 5.0

nivel_logico: null

pinos:
  - numero: 1
    nome: GND
    tipo: terra
    funcoes: ["Terra", "Referência de 0 V"]
    fonte: {documento: "I2C_1602_LCD.pdf", pagina: 1}

  - numero: 2
    nome: VCC
    tipo: alimentacao
    tensao_max: 5.0
    funcoes: ["Alimentação de 5 V"]
    fonte: {documento: "I2C_1602_LCD.pdf", pagina: 1}

  - numero: 3
    nome: SDA
    tipo: entrada_saida
    funcoes: ["I2C_SDA", "Dados I2C", "Comunicação bidirecional"]
    fonte: {documento: "I2C_1602_LCD.pdf", pagina: 3}

  - numero: 4
    nome: SCL
    tipo: entrada
    funcoes: ["I2C_SCL", "Clock I2C"]
    fonte: {documento: "I2C_1602_LCD.pdf", pagina: 3}

regras:
  - id: lcd-supply-voltage
    descricao: "O módulo requer alimentação de 5 V. Não presumir funcionamento adequado com alimentação de 3,3 V."
    severidade: erro

  - id: i2c-voltage-compatibility
    descricao: "Verificar a tensão dos resistores pull-up das linhas SDA e SCL antes de conectar a controladores de 3,3 V, como ESP32. Se estiverem ligados a 5 V, utilizar conversor de nível lógico bidirecional ou adaptar os pull-ups para 3,3 V, respeitando as especificações elétricas do módulo."
    severidade: erro

  - id: i2c-address
    descricao: "O endereço I2C depende do expansor utilizado e da configuração dos jumpers A0, A1 e A2. O datasheet informa a faixa 0x38 a 0x3F, com endereço padrão 0x3F para PCF8574A. Módulos PCF8574 podem utilizar a faixa 0x20 a 0x27, com endereço padrão 0x27."
    severidade: aviso

  - id: lcd-display-format
    descricao: "O display possui capacidade de 16 colunas por 2 linhas. Configurar a biblioteca e o firmware para a dimensão correta."
    severidade: aviso

  - id: i2c-pullups
    descricao: "As linhas SDA e SCL utilizam comunicação I2C e necessitam de resistores pull-up adequados. Verificar se já existem resistores instalados no adaptador antes de adicionar outros ao circuito."
    severidade: aviso

status: rascunho
