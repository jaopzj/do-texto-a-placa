# Posicionamento manual da placa de referência (Marco 2, Parte 6).
#
# Uma entrada por conector da netlist: x e y em milímetros e rotacao em graus,
# no sistema de coordenadas do KiCad (x para a direita, y para baixo, rotação
# anti-horária). O ponto (x, y) é o pad 1 do conector.
#
# Rotação dos conectores (PinHeader e PinSocket 1xNN, que têm a mesma orientação):
#   0  -> fileira vertical, pino 1 em cima e os demais para baixo;
#   90 -> fileira horizontal, pino 1 à esquerda e os demais para a direita.
#
# Contorno da placa-modelo (modelo/modelo.kicad_pcb): x de 52,5 a 152,5 mm e
# y de 43,5 a 143,5 mm. Todas as posições foram escolhidas para que os courtyards
# fiquem dentro dele e não se sobreponham (conferido por scripts/verificar_placa.py).
#
# Desde o Marco 3, Parte 6, os footprints vêm da base de componentes: barras macho
# 1x19 no ESP32 (J1 e J2), 1x04 no LCD (J3), 1x03 no sensor HW-101 (J4) e 1x06 no
# conversor (J5 e J6).
#
# Origem de cada dado (pecas.md, Parte 2):
# - ordem dos pinos e sentido de leitura de cada módulo: pinagem anotada;
# - distância entre J1 e J2: 25,4 mm, "estimada visualmente" no pecas.md. Conferir
#   com a peça antes de fabricar;
# - distância entre J5 e J6 (as duas fileiras do conversor) e qual lado fica à
#   esquerda: NÃO estão no pecas.md. Os valores abaixo são PROVISÓRIOS, só para o
#   pipeline andar, e precisam ser medidos antes de fabricar;
# - as dimensões dos corpos dos módulos (ESP32, LCD, sensor e conversor) não estão
#   no pecas.md, então a colisão física entre módulos encaixados não é conferida.

# ESP32: as duas fileiras na horizontal, lidas da esquerda para a direita
J1: { x: 60.00, y: 60.00, rotacao: 90 }   # fileira J2 da Espressif (pino 1 = 3V3)
J2: { x: 60.00, y: 85.40, rotacao: 90 }   # fileira J3 da Espressif (pino 1 = GND), 25,4 mm abaixo de J1

# LCD I2C e sensor: uma fileira cada, lida da esquerda para a direita
J3: { x: 110.00, y: 60.00, rotacao: 90 }  # LCD (pino 1 = GND)
J4: { x: 110.00, y: 85.40, rotacao: 90 }  # sensor (pino 1 = GND)

# Conversor de nível: duas fileiras na vertical, lidas de cima para baixo
J5: { x: 130.00, y: 60.00, rotacao: 0 }   # lado LV (pino 1 = LV1) - PROVISÓRIO
J6: { x: 140.00, y: 60.00, rotacao: 0 }   # lado HV (pino 1 = HV1) - PROVISÓRIO
